<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Abro</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..100,700..900&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700;800&display=swap">
<style>
/* Layout: neo-brutalist shift board for a phone. Sticky block tabs; each tab is one job (today, todos, leads, week, setup).
   Thick strokes, small radii, hard offset shadows, solid neon accent blocks. Light = paper, dark = ink with the same neon. */
:root{
  --paper:#F5F5DC; --card:#FFFFFF; --ink:#000000; --stroke:#000000; --muted:#55553F; --well:#ECECCF;
  --teal:#00C2CB; --magenta:#FF00FF; --yellow:#FFD700; --on-accent:#000000;
  --glow:transparent;
  --sw:3px; --r:4px; --sh1:3px 3px 0 var(--stroke); --sh2:6px 6px 0 var(--stroke);
  --display:"Archivo","Arial Narrow",Impact,system-ui,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0B0B0B; --card:#161616; --ink:#F5F5DC; --stroke:#F5F5DC; --muted:#A9A98F; --well:#222218;
  --glow:color-mix(in srgb,#00C2CB 45%,transparent); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0B0B0B; --card:#161616; --ink:#F5F5DC; --stroke:#F5F5DC; --muted:#A9A98F; --well:#222218;
  --glow:color-mix(in srgb,#00C2CB 45%,transparent); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
.top{position:sticky;top:0;z-index:5;background:var(--paper);padding:12px max(16px,env(safe-area-inset-right)) 12px max(16px,env(safe-area-inset-left));border-bottom:var(--sw) solid var(--stroke)}
.appbar{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;max-width:720px;margin:0 auto}
.appbar .ttl{min-width:0}
.eyebrow{display:flex;align-items:center;gap:6px;font:800 11px var(--mono);letter-spacing:.08em;text-transform:uppercase}
.eyebrow b{background:var(--ink);color:var(--paper);padding:2px 6px;border-radius:3px;letter-spacing:.12em}
.eyebrow i{font:800 12px/1 var(--body);font-style:normal;background:var(--yellow);color:var(--on-accent);border:2px solid #000;border-radius:3px;padding:1px 5px}
.appbar h1{margin:6px 0 0;font:900 40px/.86 var(--display);font-stretch:62%;text-transform:uppercase;letter-spacing:.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar .sub{margin-top:5px;font:700 12px var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar .side{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:none}
#clockNow{font:800 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;border:2px solid var(--stroke);border-radius:3px;padding:3px 7px;background:var(--card)}
main{padding:18px max(14px,env(safe-area-inset-right)) calc(112px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));display:grid;gap:20px;max-width:720px;margin:0 auto}
.card{background:var(--card);border:var(--sw) solid var(--stroke);border-radius:var(--r);box-shadow:var(--sh2);padding:14px;display:grid;gap:12px;min-width:0;margin-right:6px}
.card.me{box-shadow:var(--sh2),0 0 22px var(--glow)}
.who{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.who b{font:900 24px/1 var(--display);font-stretch:68%;text-transform:uppercase}
.who .tag{margin-left:auto;font:800 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;border:2px solid var(--stroke);border-radius:3px;padding:2px 6px}
.card.me .who .tag{background:var(--teal);color:var(--on-accent);border-color:#000}
.punch{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font:800 12px var(--mono)}
.punch span{border:2px solid var(--stroke);border-radius:3px;padding:4px 8px;background:var(--well)}
.punch span.on{background:var(--ink);color:var(--paper)}
.counts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.count{border:var(--sw) solid var(--stroke);border-radius:var(--r);padding:8px;display:grid;gap:4px;min-width:0;background:var(--card)}
.count label{font:800 10px var(--mono);letter-spacing:.04em;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.count .n{font:800 28px/1.1 var(--mono);font-variant-numeric:tabular-nums}
.count .n small{font-size:13px;color:var(--muted);font-weight:700}
.count.hit{background:var(--teal);color:var(--on-accent);border-color:#000;box-shadow:0 0 16px var(--glow)}
.count.hit .n small{color:var(--on-accent)}
.count.hit .step button{border-color:#000;box-shadow:2px 2px 0 #000}
.step{display:flex;gap:6px}
button{font:800 14px var(--body);border-radius:var(--r);border:var(--sw) solid var(--stroke);background:var(--card);color:var(--ink);padding:9px 14px;min-height:44px;cursor:pointer;box-shadow:var(--sh1);transition:transform .06s,box-shadow .06s}
button:active{transform:translate(3px,3px);box-shadow:none}
button:disabled{opacity:.45;box-shadow:none;cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--magenta);outline-offset:3px}
button.primary{background:var(--teal);color:var(--on-accent);border-color:#000;text-transform:uppercase;font:800 15px var(--display);font-stretch:80%;letter-spacing:.04em}
button.in{background:var(--yellow);color:var(--on-accent);border-color:#000}
button.out{background:var(--magenta);color:var(--on-accent);border-color:#000}
button.stampbtn{font:800 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;min-height:36px;padding:5px 12px}
.step button{flex:1;min-height:40px;padding:0;font:800 20px var(--mono);box-shadow:2px 2px 0 var(--stroke)}
.field{display:grid;gap:5px;min-width:0}
.field>span{font:800 10px var(--mono);letter-spacing:.06em;text-transform:uppercase}
textarea,input,select{font:15px/1.45 var(--body);color:var(--ink);background:var(--card);border:var(--sw) solid var(--stroke);border-radius:var(--r);padding:9px 10px;width:100%;min-width:0;min-height:44px}
textarea{resize:vertical;min-height:60px}
input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:var(--teal)}
::placeholder{color:var(--muted);opacity:1}
.ro p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;border-left:var(--sw) solid var(--stroke);padding-left:10px}
.empty{color:var(--muted);font-style:italic}
h2{margin:0;font:900 26px/1 var(--display);font-stretch:66%;text-transform:uppercase}
.hint{color:var(--muted);font-size:13px;margin:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.todo{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:2px solid var(--stroke)}
.todo:last-child{border-bottom:0}
.todo .box{flex:none;width:28px;height:28px;min-height:0;border-radius:3px;display:grid;place-items:center;padding:0;font:800 16px var(--mono);box-shadow:2px 2px 0 var(--stroke)}
.todo.done .box{background:var(--teal);color:var(--on-accent);border-color:#000}
.todo.done .txt{text-decoration:line-through;color:var(--muted)}
.todo .txt{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:600}
.todo .meta{font:700 11px var(--mono);color:var(--muted)}
.todo .x{border:0;background:none;box-shadow:none;min-height:0;padding:0 4px;font-size:22px;line-height:1}
.todo.ro .box{border-style:dashed;box-shadow:none;cursor:default}
.lead h3{margin:0;font:900 22px/1.05 var(--display);font-stretch:70%;text-transform:uppercase;overflow-wrap:anywhere}
.lead h3 a{color:inherit;text-decoration-thickness:3px;text-decoration-color:var(--teal);text-underline-offset:3px}
.lead p{margin:0;overflow-wrap:anywhere}
.lead .meta{font:700 12px var(--mono);color:var(--muted)}
.lead.done{background:color-mix(in srgb,var(--teal) 14%,var(--card))}
.lead.skip{opacity:.6;box-shadow:none}
.lead .row button{font-size:13px;min-height:38px;padding:5px 10px}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.bdg{font:800 10px var(--mono);letter-spacing:.05em;text-transform:uppercase;border:2px solid var(--stroke);border-radius:3px;padding:2px 6px;background:var(--card)}
.bdg.y{background:var(--yellow);color:var(--on-accent);border-color:#000} .bdg.t{background:var(--teal);color:var(--on-accent);border-color:#000} .bdg.k{background:var(--ink);color:var(--paper)}
.sel{background:var(--ink)!important;color:var(--paper)!important;box-shadow:none!important}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.slim,.filters button{font:800 11px var(--mono);min-height:36px;padding:4px 10px;text-transform:uppercase;box-shadow:2px 2px 0 var(--stroke)}
.gridwrap{overflow-x:auto;border:var(--sw) solid var(--stroke);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;min-width:420px}
th,td{padding:8px 3px;text-align:center;border-bottom:2px solid var(--stroke);font-variant-numeric:tabular-nums}
thead tr{background:var(--ink)}
th{font:800 10px var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--paper)}
td.name{text-align:left;padding-left:8px;font:900 16px var(--display);font-stretch:72%;text-transform:uppercase;white-space:nowrap}
tr:last-child td{border-bottom:0}
.hole{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:3px;border:2px dashed var(--muted);font:800 11px var(--mono)}
.hole.part{border:2px solid #000;background:var(--yellow);color:var(--on-accent)}
.hole.full{border:2px solid #000;background:var(--teal);color:var(--on-accent);box-shadow:0 0 10px var(--glow)}
.tot{font:800 13px var(--mono);text-align:right;white-space:nowrap;padding-right:8px}
@media (max-width:480px){
  table{min-width:0}
  th,td{padding:6px 1px}
  .hole{width:21px;height:21px;font-size:10px;border-width:2px}
  th,td{padding:6px 0}
  td.name{max-width:64px;overflow:hidden;text-overflow:ellipsis;font-size:13px}
  .tot{font-size:11px}
}
.goalrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.days{display:flex;flex-wrap:wrap;gap:6px}
.days label{display:flex;align-items:center;gap:6px;border:2px solid var(--stroke);border-radius:3px;padding:6px 8px;font:800 12px var(--mono);cursor:pointer;min-height:40px}
.days label:has(input:checked){background:var(--yellow);color:var(--on-accent);border-color:#000}
ol.deal{margin:0;padding-left:22px;display:grid;gap:6px;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--yellow);color:var(--on-accent);border:var(--sw) solid #000;box-shadow:4px 4px 0 #000;padding:10px 14px;border-radius:var(--r);font-weight:800;max-width:calc(100% - 32px)}
.gear{min-height:40px;width:40px;padding:0;display:grid;place-items:center;box-shadow:2px 2px 0 var(--stroke)}
.gear svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:square}
.gear.on{background:var(--yellow);color:var(--on-accent);border-color:#000}
/* Floating dock: icons only; the active tab grows into a labelled teal block. */
.tabbar{position:fixed;z-index:6;left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));bottom:calc(12px + env(safe-area-inset-bottom));
  max-width:520px;margin:0 auto;display:flex;gap:6px;padding:6px;background:var(--card);border:var(--sw) solid var(--stroke);border-radius:12px;box-shadow:5px 5px 0 var(--stroke)}
.tabbar button{position:relative;flex:1 1 0;min-width:0;min-height:54px;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 10px;border:2px solid transparent;border-radius:8px;box-shadow:none;background:none;color:var(--ink);
  font:900 15px var(--display);font-stretch:72%;letter-spacing:.04em;text-transform:uppercase;transition:flex-grow .22s cubic-bezier(.3,1.4,.5,1),background-color .15s}
.tabbar button span{display:none;white-space:nowrap}
.tabbar button:hover{background:var(--well)}
.tabbar button:active{transform:translate(2px,2px)}
.tabbar svg{width:26px;height:26px;flex:none;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:square;stroke-linejoin:miter}
.tabbar button[aria-selected="true"]{flex-grow:2.3;background:var(--teal);color:var(--on-accent);border-color:#000;box-shadow:3px 3px 0 #000,0 0 16px var(--glow)}
.tabbar button[aria-selected="true"] span{display:inline}
.tabbar .badge{position:absolute;top:5px;left:calc(50% + 6px);min-width:18px;height:18px;display:grid;place-items:center;font:800 10px/1 var(--mono);background:var(--magenta);color:#000;border:2px solid #000;border-radius:3px;padding:0 3px}
.tabbar button[aria-selected="true"] .badge{position:static;background:var(--yellow)}
.tabbar .badge:empty{display:none}
@media (prefers-reduced-motion:reduce){.tabbar button{transition:none}}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:var(--sw) solid var(--stroke);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh1)}
.seg button{border:0;border-radius:0;box-shadow:none;min-height:42px;font:800 12px var(--mono);text-transform:uppercase;letter-spacing:.05em;background:var(--card)}
.seg button+button{border-left:var(--sw) solid var(--stroke)}
.seg button.on{background:var(--ink);color:var(--paper)}
.dorow{display:flex;gap:6px;flex-wrap:wrap}
.dorow button{font:800 11px var(--mono);text-transform:uppercase;min-height:34px;padding:4px 10px;box-shadow:2px 2px 0 var(--stroke)}
.dorow button.go{background:var(--yellow);color:var(--on-accent);border-color:#000}
details.card>summary{cursor:pointer;font:900 20px var(--display);font-stretch:70%;text-transform:uppercase;list-style:none}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"+";float:right;font-family:var(--mono)}
details.card[open]>summary::after{content:"–"}
.post{white-space:pre-wrap;font:14px/1.5 var(--body);background:var(--well);border:2px solid var(--stroke);border-radius:3px;padding:10px;margin:0;overflow-wrap:anywhere}
.paper{background:#fff;color:#111;border:var(--sw) solid var(--stroke);border-radius:var(--r);box-shadow:var(--sh2);padding:22px 20px;font:13px/1.45 var(--body);margin-right:6px}
.paper h3{margin:0;font:800 22px/1.1 var(--body);color:#111}
.paper .hl{color:#0A7F86;font-weight:600;margin-top:2px}
.paper .ct{color:#555;font-size:11.5px;margin-top:4px;overflow-wrap:anywhere}
.paper h4{margin:14px 0 6px;font:800 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;border-bottom:2px solid #111;padding-bottom:2px;color:#111}
.paper .ln{display:flex;justify-content:space-between;gap:8px;font-weight:700;margin-top:6px}
.paper .ln span{font-weight:400;color:#555;font-size:11.5px;white-space:nowrap}
.paper ul{margin:3px 0 0;padding-left:18px}
.paper .mt{color:#555;font-size:11px}
details.origin{border-left:var(--sw) solid var(--magenta);padding:2px 0 2px 10px}
details.origin>summary{cursor:pointer;font:800 11px var(--mono);letter-spacing:.06em;text-transform:uppercase}
details.origin p{margin:6px 0 0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
.slim.go{background:var(--magenta);color:#000;border-color:#000}
.big{font:800 40px/1 var(--mono);font-variant-numeric:tabular-nums}
.big small{font-size:18px;color:var(--muted)}
.bar{height:16px;border:var(--sw) solid var(--stroke);border-radius:3px;background:var(--well);overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal);border-right:var(--sw) solid var(--stroke);box-shadow:0 0 12px var(--glow)}
.eyebrow{font:800 11px var(--mono);letter-spacing:.08em;text-transform:uppercase}
.gate{padding:40px 20px;text-align:center;display:grid;gap:10px;justify-items:center}
a{color:inherit}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="top">
  <div class="appbar">
    <div class="ttl">
      <div class="eyebrow"><b>Abro</b><i>አብሮ</i></div>
      <h1 id="pageTitle">Today</h1>
      <div class="sub" id="pageSub"></div>
    </div>
    <div class="side"><button type="button" class="gear" id="gearBtn" aria-label="Setup"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><rect x="14" y="4" width="4" height="4"/><rect x="8" y="10" width="4" height="4"/><rect x="16" y="16" width="4" height="4"/></svg></button><span id="clockNow"></span></div>
  </div>
</div>
<main id="main"><div class="gate"><p class="hint">Loading the board…</p></div></main>
<nav class="tabbar" role="tablist" id="tabs">
  <button role="tab" data-tab="today" aria-selected="true"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>Today</span></button>
  <button role="tab" data-tab="feed"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg><span>Feed</span><b class="badge" id="feedBadge"></b></button>
  <button role="tab" data-tab="leads"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="1"/><path d="M9 7V4h6v3M3 12h18"/></svg><span>Leads</span><b class="badge" id="leadBadge"></b></button>
  <button role="tab" data-tab="todos"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="1"/><path d="m7 12 3 3 7-7"/></svg><span>Todos</span><b class="badge" id="todoBadge"></b></button>
  <button role="tab" data-tab="you"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><span>You</span><b class="badge" id="youBadge"></b></button>
</nav>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }
  if (tg && tg.initData) { const setTheme = () => { const dark = tg.colorScheme === "dark"; document.documentElement.dataset.theme = dark ? "dark" : "light"; try { tg.setHeaderColor(dark ? "#0B0B0B" : "#F5F5DC"); tg.setBackgroundColor(dark ? "#0B0B0B" : "#F5F5DC"); } catch {} }; setTheme(); tg.onEvent("themeChanged", setTheme); }
  const initData = tg ? tg.initData : "";

  const $ = s => document.querySelector(s);
  const el = (tag, props = {}, ...kids) => { const e = document.createElement(tag); for (const [k, v] of Object.entries(props)) { if (k === "class") e.className = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else if (v != null && v !== false) e.setAttribute(k, v === true ? "" : v); } for (const c of kids.flat(Infinity)) if (c != null && c !== false) e.append(c); return e; };
  const pad = n => String(n).padStart(2, "0");
  const COUNTS = [["apps", "Apps sent"], ["outreach", "Outreach"], ["commits", "Commits"]];
  const WEEKDAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
  const safeUrl = u => { try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : null; } catch { return null; } };

  let S = null, F = null, Y = null, youSeg = "work", tab = "today", leadFilter = "open", feedFilter = "all", busy = false;
  try { tab = sessionStorage.getItem("abro-tab") || "today"; } catch {}
  if (!["today", "feed", "leads", "todos", "you", "setup"].includes(tab)) tab = "today";

  function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2200); }
  function haptic(kind = "light") { try { tg && tg.HapticFeedback.impactOccurred(kind); } catch {} }

  async function api(method, path, body) {
    const r = await fetch("/api" + path, { method, headers: { "content-type": "application/json", ...(initData ? { authorization: "tma " + initData } : {}) }, body: body ? JSON.stringify(body) : undefined });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw Object.assign(new Error(data.error || "Couldn't reach the server."), { status: r.status });
    return data;
  }
  async function act(method, path, body) {
    try { const data = await api(method, path, body); if (data && data.members) { S = data; render(); } return data; }
    catch (e) { toast(e.message); }
  }
  async function load() {
    try { S = await api("GET", "/state"); render(); }
    catch (e) { $("#main").replaceChildren(el("div", { class: "gate" }, el("h2", {}, e.status === 403 ? "Not on the team yet" : "Open Abro from Telegram"), el("p", { class: "hint" }, e.message))); }
  }

  const me = () => S.members.find(m => m.id === S.me);

          youAct("PUT", "/profile", { profile: { name: d.get("name"), headline: d.get("headline"), location: d.get("location"), email: d.get("email"), website: d.get("website"),
            links: textToLinks(d.get("links")), summary: d.get("summary"), experience: textToExp(d.get("experience")), education: textToEdu(d.get("education")), skills: textToSkills(d.get("skills")) } }, "Profile saved."); });
        return f;
      })());
    const picked = Y.works.filter(w => w.in_resume).length;
    const gen = el("form", { class: "card" }, el("h2", {}, "Generate"),
      el("p", { class: "hint" }, `Uses your profile and the ${picked} work item${picked === 1 ? "" : "s"} you ticked for the resume.`),
      el("label", { class: "field" }, el("span", {}, "Aim it at (optional)"), el("input", { id: "r-target", value: Y.resume ? Y.resume.target : "", placeholder: "Forward Deployed AI Engineer, remote" })),
      el("div", { class: "row", style: "justify-content:flex-end" }, el("button", { class: "primary", type: "submit", disabled: !Y.ai }, Y.resume ? "Regenerate" : "Generate")));
    gen.addEventListener("submit", e => { e.preventDefault(); toast("Writing your resume…"); youAct("POST", "/resume/generate", { target: $("#r-target").value.trim() }, "Resume ready."); });
    const out = [prof, gen];
    if (Y.resume) {
      out.push(el("div", { class: "card" },
        el("div", { class: "row", style: "justify-content:space-between" }, el("h2", {}, "Your resume"), el("span", { class: "meta" }, `Made ${new Date(Y.resume.generatedAt).toLocaleDateString(undefined, { day: "numeric", month: "short" })}${Y.resume.publishedAt ? " · on portfolio" : ""}`)),
        el("div", { class: "dorow" },
          el("button", { type: "button", class: "go", onclick: () => download("pdf") }, "PDF"),
          el("button", { type: "button", onclick: () => download("docx") }, "Word"),
          el("button", { type: "button", onclick: () => youAct("POST", "/resume/send") }, "Send to chat"),
          linked ? el("button", { type: "button", onclick: () => youAct("POST", "/resume/publish") }, "Put on portfolio") : null)),
        resumePaper(Y.resume.data));
    }
    return out;
  }
  function viewYou() {
    if (!Y) { loadYou(); return [el("p", { class: "hint" }, "Loading…")]; }
    if (Y.error) return [el("div", { class: "card" }, el("b", {}, "This didn't load"), el("p", { class: "hint" }, Y.error))];
    const seg = el("div", { class: "seg" }, [["work", "Work"], ["brand", "Brand"], ["resume", "Resume"]].map(([k, label]) =>
      el("button", { type: "button", class: youSeg === k ? "on" : "", onclick: () => { youSeg = k; render(); setTitle(); } }, label)));
    const ai = !Y.ai ? el("p", { class: "hint" }, "No AI key on the server yet, so writing drafts and the resume generator are off.") : null;
    return [seg, ai, ...({ work: viewWork, brand: viewBrand, resume: viewResume }[youSeg] || viewWork)()];
  }

  // ---- Setup ---------------------------------------------------------------
  function viewSetup() {
    const m = me(), s = S.session;
    const goals = el("form", { class: "card" }, el("h2", {}, "My daily minimums"),
      el("div", { class: "goalrow" }, COUNTS.map(([k, label]) => el("label", { class: "field" }, el("span", {}, label), el("input", { id: "g-" + k, type: "number", min: "0", max: "50", value: String(m.goals[k]) })))),
      el("label", { class: "field" }, el("span", {}, "Posts per week (X, LinkedIn, dev.to)"), el("input", { id: "g-posts", type: "number", min: "0", max: "21", value: String(m.goalPosts ?? 3) })),
      el("label", { class: "field" }, el("span", {}, "My time zone"), el("input", { id: "g-tz", value: m.tz, placeholder: "Asia/Shanghai" })),
      el("label", { class: "field" }, el("span", {}, "What I'm working toward (the feed uses this)"), (() => { const t = el("textarea", { id: "g-focus", maxlength: "500", rows: "3", placeholder: "Frontend roles, React + TypeScript. Want more backend and testing skills." }); t.value = m.focus || ""; return t; })()),
      el("div", { class: "row", style: "justify-content:flex-end" }, el("button", { class: "primary", type: "submit" }, "Save")));
    goals.addEventListener("submit", async e => {
      e.preventDefault();
      const body = { goals: Object.fromEntries(COUNTS.map(([k]) => [k, Number($("#g-" + k).value) || 0])), tz: $("#g-tz").value.trim(), focus: $("#g-focus").value.trim(), goalPosts: Number($("#g-posts").value) || 0 };
      if (await act("POST", "/me", body)) toast("Saved.");
    });
    const sess = el("form", { class: "card" }, el("h2", {}, "Live sessions"),
      el("div", { class: "days" }, WEEKDAYS.map(d => el("label", {}, el("input", { type: "checkbox", value: d, checked: s.days.includes(d) }), d))),
      el("div", { class: "goalrow", style: "grid-template-columns:1fr 2fr" },
        el("label", { class: "field" }, el("span", {}, `Time (${s.tz})`), el("input", { id: "s-time", value: s.time, placeholder: "20:00", inputmode: "numeric" })),
        el("label", { class: "field" }, el("span", {}, "Call link"), el("input", { id: "s-link", value: s.link, placeholder: "https://meet.google.com/…" }))),
      s.local && s.local !== s.time ? el("p", { class: "hint" }, `That's ${s.local} for you.`) : null,
      el("p", { class: "hint" }, "The bot posts a reminder 15 minutes before each session."),
      el("div", { class: "row", style: "justify-content:flex-end" }, el("button", { class: "primary", type: "submit" }, "Save")));
    sess.addEventListener("submit", async e => {
      e.preventDefault();
      const body = { days: [...sess.querySelectorAll(".days input:checked")].map(x => x.value), time: $("#s-time").value.trim(), link: $("#s-link").value.trim() };
      if (await act("POST", "/session", body)) toast("Saved.");
    });
    const rules = el("div", { class: "card" }, el("h2", {}, "The deal"), el("ol", { class: "deal" },
      ["Clock in with today's plan before you start.", "Hit your daily minimums and log them as they happen.", "Any role that fits the other person goes in Leads.", "Clock out with what got done and anything blocking you.", "Sunday: look at the Week tab together and adjust goals.", "Missed a day? Say so in your card and pick it back up tomorrow."].map(t => el("li", {}, t))));
    const linked = Y && Y.portfolio && Y.portfolio.url;
    const port = el("form", { class: "card" }, el("h2", {}, "My portfolio API"),
      el("p", { class: "hint" }, linked ? `Linked: ${Y.portfolio.url}` : "Your portfolio's /api/abro address and key. Abro adds work as drafts and publishes when you say so."),
      el("label", { class: "field" }, el("span", {}, "API address"), el("input", { id: "p-url", type: "url", value: linked || "", placeholder: "https://your-site.vercel.app/api/abro" })),
      el("label", { class: "field" }, el("span", {}, "Key"), el("input", { id: "p-key", type: "password", autocomplete: "off", placeholder: linked ? "Saved. Enter a new one to change it." : "The key your site expects" })),
      el("div", { class: "row", style: "justify-content:space-between" },
        linked ? el("button", { type: "button", onclick: () => youAct("DELETE", "/portfolio", null, "Unlinked.") }, "Unlink") : el("span"),
        el("button", { class: "primary", type: "submit" }, "Save and test")));
    port.addEventListener("submit", e => { e.preventDefault(); toast("Testing the link…"); youAct("PUT", "/portfolio", { url: $("#p-url").value.trim(), key: $("#p-key").value.trim() }); });
    if (!Y) loadYou();
    return [goals, port, sess, rules];
  }

  load().then(loadFeed).then(loadYou);
  setInterval(() => { if (!document.hidden && tab !== "feed") loadFeed(); }, 5 * 60_000);
  setInterval(() => { if (!document.hidden && !(document.activeElement && /^(t-|todoText|l|g-|s-)/.test(document.activeElement.id || ""))) load(); }, 20000);
  setInterval(tickClock, 20000);
})();
</script>
</body>
